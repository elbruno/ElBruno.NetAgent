name: Package

on:
  push:
    branches:
      - main

jobs:
  pack:
    name: Pack and upload artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ElBruno.NetAgent.sln

      - name: Build
        run: dotnet build ElBruno.NetAgent.sln --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/ElBruno.NetAgent/ElBruno.NetAgent.csproj --configuration Release --no-build --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
